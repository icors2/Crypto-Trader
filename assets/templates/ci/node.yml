# Copy to .github/workflows/ci.yml for a Node/TypeScript app.
# Adjust package manager (npm/pnpm/yarn) and script names to match package.json.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present
      - name: Starter verify (if present)
        run: |
          if [ -f scripts/audit-cursor-setup.mjs ]; then npm run verify; else echo "skip"; fi
