[project]
name = "crypto-trader"
version = "0.1.0"
description = "Paper-by-default Robinhood crypto day-trader with Coinbase indicators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pynacl>=1.5",
    "python-multipart>=0.0.12",
    "ruamel.yaml>=0.18",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
crypto-trader = "crypto_trader.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_trader = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["crypto_trader"]
