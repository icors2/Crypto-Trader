# Paper trader on a VM or laptop.
# Host bind stays on loopback. Secrets come from .env (untracked).

services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      BIND_HOST: "0.0.0.0"
      PORT: "8000"
      CONFIG_DIR: /app/config
      DATA_DIR: /app/data
      TZ: America/Chicago
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped
