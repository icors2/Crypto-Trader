name: Bug report
description: Something is broken or incorrect
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Numbered steps, sample input, or a minimal repo
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node/Python version, browser, deploy target
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact secrets and tokens
